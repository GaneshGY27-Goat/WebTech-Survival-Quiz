<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3-Lives Web Tech Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="quiz-container">
    <!-- Header: Status, Lives, & Timer -->
    <header class="quiz-header" id="quiz-header">
      <div class="question-tracker">
        Question <span id="current-q">1</span>/<span id="total-q">50</span>
      </div>
      <div class="lives-tracker">
        Lives: <span id="lives-display">❤️❤️❤️</span>
      </div>
      <div class="timer-box">
        Time Left: <span id="time-left">30</span>s
      </div>
    </header>

    <!-- Quiz Screen -->
    <main id="quiz-screen">
      <h2 id="question-text">Question will appear here</h2>
      <div class="options-grid" id="options-container">
        <!-- Option buttons dynamically generated by JS -->
      </div>
      <footer class="quiz-footer">
        <button id="next-btn" class="action-btn hide">Next Question</button>
      </footer>
    </main>

    <!-- Result / Summary Screen (Hidden by default) -->
    <section id="result-screen" class="hide">
      <h2>Quiz Completed!</h2>
      <div class="score-display">
        You scored <span id="final-score">0</span> out of <span id="max-score">0</span>
      </div>
      <p id="performance-feedback"></p>
      <button id="restart-btn" class="action-btn">Restart Quiz</button>
    </section>

    <!-- Flash Overlay Banner on 3rd Failure -->
    <div id="flash-overlay" class="flash-overlay hide">
      <div class="flash-card">
        <div class="flash-icon">&#10006;</div>
        <h2>Game Over!</h2>
        <p>3 Wrong Answers &mdash; Restarting from the beginning...</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
